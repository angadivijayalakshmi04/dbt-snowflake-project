version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

      - name: customer_name
        data_tests:
          - not_null

  - name: stg_orders
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: order_date
        data_tests:
          - not_null

      - name: amount
        data_tests:
          - not_null

  - name: int_customer_orders
    columns:
      - name: customer_id
        data_tests:
          - not_null

      - name: order_id
        data_tests:
          - not_null

      - name: order_date
        data_tests:
          - not_null

      - name: amount
        data_tests:
          - not_null

  - name: dim_customers
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

      - name: customer_name
        data_tests:
          - not_null

  - name: fact_orders
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_date
        data_tests:
          - not_null

      - name: amount
        data_tests:
          - not_null

  - name: fct_orders_incremental
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_date
        data_tests:
          - not_null

      - name: amount
        data_tests:
          - not_null